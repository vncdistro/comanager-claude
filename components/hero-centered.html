<!-- COMPONENT: Hero (centered) · framed image card with centered copy
     Per-page photo: set style="--hero-img:url('../assets/img/your-photo.jpg')" on .hero-photo's parent (.hero-frame) — or override --hero-img on :root.
     Edit: eyebrow, h1, serif sub copy, button label. -->
<header class="hero hero-centered section" id="top">
  <div class="hero-frame">
    <div class="hero-photo"></div>
    <div class="hero-frame-veil"></div>
    <div class="hero-inner">
      <div class="hero-copy">
        <span class="eyebrow reveal"><span class="dot"></span>Free · 5 minutes</span>
        <h1 class="reveal" data-d="1">Let us make your<br />artist brand book</h1>
        <p class="hero-sub hero-sub-serif reveal" data-d="2">Your free Artist Aura gives you a complete EPK, professional bio, fan archetypes, and visual identity — all personalized to your music.</p>
        <div class="hero-actions reveal" data-d="3">
          <button class="btn btn-primary" data-open-waitlist>Get Your Artist Aura <span class="arrow"></span></button>
        </div>
      </div>
    </div>
  </div>
</header>
