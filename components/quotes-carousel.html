<!-- COMPONENT: Quotes (carousel) · 3 rotating tilted cards, auto-advance + dots
     Behavior is wired by data-carousel (auto-rotates every 4800ms; data-interval overrides).
     IMPORTANT: keep the number of .q-card and .q-dots dots (.q-dot) equal.
     Edit: serif-lead heading and each blockquote/cite. -->
<section class="quotes section wrap" id="quotes">
  <h2 class="serif-lead reveal">Artists are impressed by Aura.</h2>
  <div class="q-stage" data-carousel data-interval="4800">
    <article class="q-card">
      <span class="mark">&ldquo;</span>
      <blockquote>comanager helped me ideate and come up with innovative ideas to try.</blockquote>
      <cite>— DNA Picasso</cite>
    </article>
    <article class="q-card">
      <span class="mark">&ldquo;</span>
      <blockquote>comanager just lifted the veil on a lot of things that feel daunting.</blockquote>
      <cite>— Soleille La Sage</cite>
    </article>
    <article class="q-card">
      <span class="mark">&ldquo;</span>
      <blockquote>Ideas that I wouldn't have come up with on my own.</blockquote>
      <cite>— Moiso</cite>
    </article>
  </div>
  <div class="q-dots" data-dots>
    <span class="q-dot" data-on="1"></span>
    <span class="q-dot" data-on="0"></span>
    <span class="q-dot" data-on="0"></span>
  </div>
</section>
