<!-- COMPONENT: CTA (banner) · full-bleed immersive photo banner
     Per-page photo: set style="--cta-img:url('../assets/img/your-photo.jpg')" on .cta-card .photo (or override --cta-img on :root).
     Edit: h2 (the .tell span is the Syne sub-line under the serif line) and button label. -->
<section class="cta-sec section" id="story">
  <div class="cta-card">
    <div class="photo"></div>
    <div class="veil"></div>
    <div class="inner reveal">
      <h2>Your music has a story.<span class="tell">Let's tell it right.</span></h2>
      <div class="cta"><button class="btn btn-primary" data-open-waitlist>Join the Waitlist <span class="arrow"></span></button></div>
    </div>
  </div>
</section>
