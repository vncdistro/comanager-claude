<!-- COMPONENT: Hero (split) · photo on one side, copy on the other
     data-side="right" (default) or "left" flips the photo + text alignment.
     Per-page photo: set style="--hero-img:url('../assets/img/your-photo.jpg')" on .hero
     Edit: eyebrow, h1 (keep the <span class="serif"> on the word you want italic), sub copy, button label. -->
<header class="hero section" data-side="right" id="top">
  <div class="hero-photo"></div>
  <div class="hero-veil"></div>
  <div class="hero-veil-v"></div>
  <div class="hero-inner wrap">
    <div class="hero-copy">
      <span class="eyebrow reveal"><span class="dot"></span>Free · 5 minutes</span>
      <h1 class="reveal" data-d="1">Let us make your<br />artist <span class="serif">brand book.</span></h1>
      <p class="hero-sub reveal" data-d="2">Your free Artist Aura gives you a complete EPK and visual identity, personalized to your music.</p>
      <div class="hero-actions reveal" data-d="3">
        <button class="btn btn-primary" data-open-waitlist>Get Your Artist Aura <span class="arrow"></span></button>
      </div>
    </div>
  </div>
</header>
